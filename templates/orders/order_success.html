{% extends "base.html" %}

{% block title %}Order Success{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <h2 class="mb-2">✅ Your order is confirmed</h2>
    <p class="text-muted">
        Order ID: <strong>#{{ order_id }}</strong>
    </p>
    <p>
        Total Amount: <strong>₹{{ order_total_amount }}</strong>
    </p>
    <a class="btn btn-primary mt-3" href="{% url 'store:product_list' %}">
        Continue Shopping
    </a>
</div>
{% endblock %}
