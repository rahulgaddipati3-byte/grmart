{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}G.R Mart{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="top-bar">
    <div class="logo">
        <a href="{% url 'store:product_list' %}">G.R Mart</a>
    </div>

    <nav class="main-nav">
        <a href="{% url 'store:product_list' %}">Products</a>
        <a href="{% url 'store:product_list' %}?tag=deals">Today's Deals</a>
    </nav>

    <form class="search-box" action="{% url 'store:product_list' %}" method="get">
        <input
            type="text"
            name="q"
            value="{{ request.GET.q|default:'' }}"
            placeholder="Search products..."
        >
    </form>

    <div class="right-links">
        <!-- Cart link – IMPORTANT: namespaced as cart:view -->
        <a href="{% url 'cart:view' %}" class="cart-pill">
            <span>Cart</span>
            <span class="cart-count">{{ cart_items_count|default:0 }}</span>
        </a>

        <!-- Auth links – these are simple URLs, no extra reverse names -->
        <a href="/accounts/login/">Login</a>
        <a href="/accounts/signup/">Register</a>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>&copy; 2025 G.R Mart. All rights reserved.</p>
</footer>
</body>
</html>
