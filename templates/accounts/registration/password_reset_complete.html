{% extends "base.html" %}
{% block title %}Password changed • G.R Mart{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="surface p-4">
      <h2 class="mb-3">Password updated</h2>
      <p class="text-muted-neo mb-4">
        Your password has been set successfully. You can now sign in with your
        new password.
      </p>

      <a href="{% url 'login' %}" class="btn btn-primary">
        Go to login
      </a>
    </div>
  </div>
</div>
{% endblock %}
