{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="text-2xl font-semibold mb-6">Log in</h1>

        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn-primary w-full mt-4">
                Log in
            </button>
        </form>

        <div class="mt-4 text-sm text-slate-400">
            <!-- We REMOVE the password_reset url to avoid NoReverseMatch -->
            <p>Forgot your password? <span class="text-slate-500">Password reset is not enabled.</span></p>
        </div>

        <div class="mt-4 text-sm text-slate-400">
            <p>
                Don’t have an account?
                <a href="{% url 'accounts:signup' %}" class="link-primary">Sign up</a>

            </p>
        </div>
    </div>
</div>
{% endblock %}
