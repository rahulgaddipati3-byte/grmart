{% extends "base.html" %}
{% block title %}Verify OTP{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2>Verify OTP</h2>

  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags }}">{{ m }}</div>
    {% endfor %}
  {% endif %}

  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
      <label for="otp" class="form-label">Enter OTP</label>
      <!-- name MUST be "otp" -->
      <input id="otp" name="otp" type="text" class="form-control" autocomplete="one-time-code" required>
    </div>
    <button type="submit" class="btn btn-success">Verify</button>
  </form>
</div>
{% endblock %}
