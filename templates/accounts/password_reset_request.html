{% extends "base.html" %}
{% block title %}Reset password • G.R Mart{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="surface p-4">
      <h2 class="mb-3">Forgot your password?</h2>
      <p class="text-muted-neo mb-4">
        Enter the email linked to your G.R Mart account. We’ll send you a 6-digit code to reset your password.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <button class="btn btn-glow w-100" type="submit">Send OTP</button>
      </form>

      <div class="mt-3">
        <a href="{% url 'accounts:login' %}" class="text-sec">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
