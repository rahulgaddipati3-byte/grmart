{% extends "base.html" %}
{% block title %}Enter OTP • G.R Mart{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="surface p-4">
      <h2 class="mb-3">Reset your password</h2>
      <p class="text-muted-neo mb-4">
        We’ve sent an OTP to your email. Enter the code and choose a new password.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">OTP code</label>
          <input type="text" name="otp" class="form-control" maxlength="6" required>
        </div>

        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" name="password1" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm new password</label>
          <input type="password" name="password2" class="form-control" required>
        </div>

        <button class="btn btn-glow w-100" type="submit">Change password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
