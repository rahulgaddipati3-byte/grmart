<form action="{% url 'cart:add_to_cart' product.id %}" method="post" style="margin-top:12px;display:flex;gap:8px;align-items:center;">
    {% csrf_token %}
    <input type="number" name="quantity" value="1" min="1"
           style="width:64px;padding:6px 8px;border-radius:999px;border:1px solid rgba(148,163,184,.6);
                  background:#020617;color:#e5e7eb;">
    <button type="submit"
            style="flex:1;padding:8px 12px;border-radius:999px;border:none;
                   background:#2563eb;color:#e5e7eb;font-weight:600;cursor:pointer;">
        Add to Cart
    </button>
</form>
