{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">Products</h2>

  <div class="row">
    {% for product in products %}
      <div class="col-md-4 mb-3">
        <div class="card h-100">

          {% if product.image_url %}
            <img src="{{ product.image_url }}" class="card-img-top" alt="{{ product.name }}">
          {% elif product.image %}
            <img src="{{ product.image.url }}" class="card-img-top" alt "{{ product.name }}">
          {% endif %}

          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ product.name }}</h5>
            <p class="card-text text-muted mb-1">₹ {{ product.price }}</p>

            <div class="mt-auto">
              <!-- ✅ Correct detail URL (with namespace + correct name) -->
              <a href="{% url 'store:product_detail' product.pk %}" class="btn btn-sm btn-outline-primary">
                View
              </a>

              <!-- ✅ Correct Add-to-cart URL -->
              <form method="post" action="{% url 'cart:add_to_cart' product.id %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-primary">Add to Cart</button>
              </form>
            </div>
          </div>

        </div>
      </div>
    {% empty %}
      <p>No products available.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
